<!DOCTYPE html>
<html>
<head>
    <title>Agro Predict Wise - Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background: #f8f9fa; }
        .error { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        .success { background: #d4edda; color: #155724; border-color: #c3e6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Agro Predict Wise - Test Interface</h1>
        
        <div>
            <button onclick="testHealth()">Test Backend Health</button>
            <button onclick="testWeather()">Test Weather API</button>
            <button onclick="testPrediction()">Test Crop Prediction</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        const baseUrl = 'http://localhost:3001';
        const resultDiv = document.getElementById('result');
        
        function displayResult(data, isError = false) {
            resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            resultDiv.className = isError ? 'error' : 'success';
        }
        
        async function testHealth() {
            try {
                const response = await fetch(`${baseUrl}/api/health`);
                const data = await response.json();
                displayResult(data);
            } catch (error) {
                displayResult({ error: error.message }, true);
            }
        }
        
        async function testWeather() {
            try {
                const response = await fetch(`${baseUrl}/api/weather/current?location=Delhi`);
                const data = await response.json();
                displayResult(data);
            } catch (error) {
                displayResult({ error: error.message }, true);
            }
        }
        
        async function testPrediction() {
            try {
                const requestData = {
                    location: "Delhi",
                    soilType: "loamy",
                    season: "kharif"
                };
                const response = await fetch(`${baseUrl}/api/predict/crop`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });
                const data = await response.json();
                displayResult(data);
            } catch (error) {
                displayResult({ error: error.message }, true);
            }
        }
    </script>
</body>
</html>
